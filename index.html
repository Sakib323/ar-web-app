<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>AR Image Tracking</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="style.css" />

  <!-- Import‑map for modules -->
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
      "mindar-image-three": "https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-three.prod.js"
    }
  }
  </script>
</head>

<body>
  <div id="ar-container"></div>

  <audio id="marker-sound" src="assets/beep.mp3" preload="auto"></audio>

  <script type="module">
    import * as THREE from 'three';
    import { MindARThree } from 'mindar-image-three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

    async function start() {
      const mindarThree = new MindARThree({
        container: document.querySelector('#ar-container'),
        imageTargetSrc: './assets/marker.mind'
      });
      const { renderer, scene, camera } = mindarThree;

      scene.add(new THREE.AmbientLight(0xffffff, 0.8));
      const dirLight = new THREE.DirectionalLight(0xffffff, 1);
      dirLight.position.set(0, 1, 1).normalize();
      scene.add(dirLight);

      const anchor = mindarThree.addAnchor(0);
      const loader = new GLTFLoader();

      // Load animated model in center
      const gltfMain = await loader.loadAsync('./assets/model.glb');
      gltfMain.scene.scale.set(0.2, 0.2, 0.2);
      gltfMain.scene.position.set(0, 0, 0);
      anchor.group.add(gltfMain.scene);

      // Load first static cv.glb (placed on diagonal AC)
      const gltfCV1 = await loader.loadAsync('./assets/cv.glb');
      gltfCV1.scene.scale.set(1, 1, 1);
      gltfCV1.scene.position.set(-1.0, 0, -1.0); // Increased gap toward A
      anchor.group.add(gltfCV1.scene);

      // Load second static cv.glb (placed opposite on diagonal BD)
      const gltfCV2 = await loader.loadAsync('./assets/cv.glb');
      gltfCV2.scene.scale.set(1, 1, 1);
      gltfCV2.scene.position.set(1.0, 0, 1.0); // Increased gap toward C
      anchor.group.add(gltfCV2.scene);

      const audio = document.querySelector('#marker-sound');

      // Animation
      let animationType = "none";
      let animationInterval = null;
      const animationOptions = ["rotate360", "rotateX", "rotateY", "rotateZ", "pulse"];
      const chooseRandomAnimation = () => {
        animationType = animationOptions[Math.floor(Math.random() * animationOptions.length)];
      };

      anchor.onTargetFound = () => {
        if (audio) {
          audio.currentTime = 0;
          audio.play();
        }
        chooseRandomAnimation();
        animationInterval = setInterval(chooseRandomAnimation, 2000); // every 2s
      };

      anchor.onTargetLost = () => {
        animationType = "none";
        clearInterval(animationInterval);
      };

      // Raycasting for interaction
      const raycaster = new THREE.Raycaster();
      const mouse = new THREE.Vector2();
      let clickedObject = null;

      // Handle mouse click
      const onMouseClick = (event) => {
        // Update mouse position
        mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
        mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

        // Cast a ray to find intersections
        raycaster.updateMatrixWorld();
        raycaster.setFromCamera(mouse, camera);

        const intersects = raycaster.intersectObjects(scene.children, true);

        if (intersects.length > 0) {
          clickedObject = intersects[0].object;

          // Check if clicked on cv models
          if (clickedObject === gltfCV1.scene) {
            scaleUpAndRedirect(gltfCV1.scene, 'https://example1.com');
          } else if (clickedObject === gltfCV2.scene) {
            scaleUpAndRedirect(gltfCV2.scene, 'https://example2.com');
          }
        }
      };

      // Scale up the clicked model and redirect
      const scaleUpAndRedirect = (object, url) => {
        // Scale up the object
        object.scale.set(1.2, 1.2, 1.2);

        // Redirect to the URL after a short delay
        setTimeout(() => {
          window.location.href = url;
        }, 500); // Redirect after 500ms delay (to give the user a chance to see the scaling)
      };

      // Listen for mouse click events
      window.addEventListener('click', onMouseClick);

      // Animate main model only
      const clock = new THREE.Clock();
      renderer.setAnimationLoop(() => {
        const time = clock.getElapsedTime();

        // Reset
        gltfMain.scene.rotation.set(0, 0, 0);
        gltfMain.scene.position.set(0, 0, 0);
        gltfMain.scene.scale.set(0.1, 0.1, 0.1);

        switch (animationType) {
          case "rotate360":
            gltfMain.scene.rotation.y = time * 4;
            break;
          case "rotateX":
            gltfMain.scene.rotation.x = time * 2;
            break;
          case "rotateY":
            gltfMain.scene.rotation.y = time * 2;
            break;
          case "rotateZ":
            gltfMain.scene.rotation.z = time * 2;
            break;
          case "pulse":
            const scale = 0.1 + Math.sin(time * 5) * 0.05;
            gltfMain.scene.scale.set(scale, scale, scale);
            break;
        }

        renderer.render(scene, camera);
      });

      await mindarThree.start();
    }

    start();
  </script>
</body>

</html>
