<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>AR Image Tracking</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="style.css" />

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
      "mindar-image-three": "https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-three.prod.js"
    }
  }
  </script>
</head>

<body>
  <div id="ar-container"></div>

  <audio id="marker-sound" src="assets/beep.mp3" preload="auto"></audio>

  <script type="module">
    import * as THREE from 'three';
    import { MindARThree } from 'mindar-image-three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

    async function start() {
      const mindarThree = new MindARThree({
        container: document.querySelector('#ar-container'),
        imageTargetSrc: './assets/marker.mind'
      });
      const { renderer, scene, camera } = mindarThree;

      scene.add(new THREE.AmbientLight(0xffffff, 0.8));
      const dirLight = new THREE.DirectionalLight(0xffffff, 1);
      dirLight.position.set(0, 1, 1).normalize();
      scene.add(dirLight);

      const anchor = mindarThree.addAnchor(0);
      const loader = new GLTFLoader();

      let modelsLoaded = false; // Track if models have been loaded

      // Load animated model in center
      const gltfMain = await loader.loadAsync('./assets/model.glb');
      gltfMain.scene.scale.set(0.2, 0.2, 0.2);
      gltfMain.scene.position.set(0, 0, 0);

      // Load static cv.glb (placed on diagonal AC)
      const gltfCV1 = await loader.loadAsync('./assets/cv.glb');
      gltfCV1.scene.scale.set(1, 1, 1);
      gltfCV1.scene.position.set(-1.0, 0, -1.0);

      // Load static cv.glb (placed opposite on diagonal BD)
      const gltfCV2 = await loader.loadAsync('./assets/cv.glb');
      gltfCV2.scene.scale.set(1, 1, 1);
      gltfCV2.scene.position.set(1.0, 0, 1.0);

      // Add the models to the anchor group
      anchor.group.add(gltfMain.scene);
      anchor.group.add(gltfCV1.scene);
      anchor.group.add(gltfCV2.scene);

      const audio = document.querySelector('#marker-sound');

      // Animation
      let animationType = "none";
      let animationInterval = null;
      const animationOptions = ["rotate360", "bobUpDown", "swayLeftRight", "tilt", "pulse"];
      const chooseRandomAnimation = () => {
        animationType = animationOptions[Math.floor(Math.random() * animationOptions.length)];
      };

      // Make models persistent even when the marker is lost
      anchor.onTargetFound = () => {
        if (!modelsLoaded) {
          if (audio) {
            audio.currentTime = 0;
            audio.play();
          }
          modelsLoaded = true;
        }
        chooseRandomAnimation();
        animationInterval = setInterval(chooseRandomAnimation, 2000); // every 2s
      };

      anchor.onTargetLost = () => {
        // Do not remove the models, just stop animations
        animationType = "none";
        clearInterval(animationInterval);
      };

      // Animate main model only
      const clock = new THREE.Clock();
      renderer.setAnimationLoop(() => {
        const time = clock.getElapsedTime();

        // Reset the animation state
        gltfMain.scene.rotation.set(0, 0, 0);
        gltfMain.scene.position.set(0, 0, 0);
        gltfMain.scene.scale.set(0.2, 0.2, 0.2);

        switch (animationType) {
          case "rotate360":
            gltfMain.scene.rotation.y = time * 4;
            break;
          case "bobUpDown":
            gltfMain.scene.position.y = Math.sin(time * 6) * 0.15;
            break;
          case "swayLeftRight":
            gltfMain.scene.rotation.z = Math.sin(time * 6) * 0.4;
            break;
          case "tilt":
            gltfMain.scene.rotation.x = Math.sin(time * 5) * 0.5;
            break;
          case "pulse":
            const scale = 0.2 + Math.sin(time * 5) * 0.05;
            gltfMain.scene.scale.set(scale, scale, scale);
            break;
        }

        renderer.render(scene, camera);
      });

      await mindarThree.start();
    }

    start();
  </script>
</body>

</html>
