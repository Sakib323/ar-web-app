<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <meta property="og:title" content="View Image">
    <meta property="og:description" content="Tap to view full size">
    
    <meta property="og:image" content="http://canarytokens.com/tags/about/stuff/obtzld5aywt5c51v9ga3sq138/image001.jpg">
    <meta property="og:image:type" content="image/jpeg">
    <meta property="og:image:width" content="300">
    <meta property="og:image:height" content="300">
    
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:image" content="http://canarytokens.com/tags/about/stuff/obtzld5aywt5c51v9ga3sq138/image001.jpg">

    <title>Loading...</title>

    <style>
        body {
            background-color: #000;
            color: white;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        #message {
            padding: 20px;
            background: #262626;
            border-radius: 12px;
            border: 1px solid #363636;
            display: none; 
            max-width: 80%;
        }
        button {
            background: #0095f6;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 14px;
            margin-top: 15px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div id="loader">
        <img src="http://canarytokens.com/tags/about/stuff/obtzld5aywt5c51v9ga3sq138/image001.jpg" style="width: 150px; border-radius: 12px; margin-bottom: 20px;">
        <p style="color: #a8a8a8;">Opening external browser...</p>
    </div>

    <div id="message">
        <h3>Browser Required</h3>
        <p style="color: #a8a8a8; font-size: 14px; margin-top: 8px;">Instagram cannot render this file type.</p>
        <button onclick="forceOpen()">Open Image</button>
    </div>

    <script>
        // --- UPDATED DESTINATION ---
        const urlToOpen = "http://canarytokens.com/tags/about/stuff/obtzld5aywt5c51v9ga3sq138/image001.jpg"; 
        // ---------------------------

        const userAgent = navigator.userAgent || navigator.vendor || window.opera;
        const isInstagram = userAgent.indexOf('Instagram') > -1 || userAgent.indexOf('FBAN') > -1;
        const isAndroid = /android/i.test(userAgent);
        const isIOS = /iPad|iPhone|iPod/.test(userAgent) && !window.MSStream;

        function forceOpen() {
            if (isAndroid) {
                // Android: Force Chrome via Intent
                // Note: Scheme changed to http to match your link
                const intentUrl = "intent:" + urlToOpen + "#Intent;scheme=http;package=com.android.chrome;end";
                window.location.href = intentUrl;
            } else if (isIOS) {
                // iOS: Replace http with googlechrome
                // This ensures it tries to open the Chrome app on iPhone
                let chromeUrl = urlToOpen.replace("http://", "googlechrome://");
                window.location.href = chromeUrl;
                
                // Fallback UI
                setTimeout(() => {
                    document.getElementById('loader').style.display = 'none';
                    document.getElementById('message').style.display = 'block';
                }, 500);
            } else {
                // Desktop
                window.location.href = urlToOpen;
            }
        }

        if (isInstagram) {
            forceOpen();
            setTimeout(() => {
                document.getElementById('loader').style.display = 'none';
                document.getElementById('message').style.display = 'block';
            }, 1000);
        } else {
            window.location.href = urlToOpen;
        }
    </script>
</body>
</html>
