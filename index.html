<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>AR Image Tracking</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="style.css" />

  <!-- Import‑map for modules -->
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
      "mindar-image-three": "https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-three.prod.js"
    }
  }
  </script>
</head>

<body>
  <div id="ar-container"></div>

  <!-- Audio to play on first detection -->
  <audio id="marker-sound" src="assets/beep.mp3" preload="auto"></audio>

  <script type="module">
    import * as THREE from 'three';
    import { MindARThree } from 'mindar-image-three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

    async function start() {
      // 1) Initialize AR
      const mindarThree = new MindARThree({
        container: document.querySelector('#ar-container'),
        imageTargetSrc: './assets/marker.mind'
      });
      const { renderer, scene, camera } = mindarThree;

      // 2) Lighting
      scene.add(new THREE.AmbientLight(0xffffff, 0.8));
      const dirLight = new THREE.DirectionalLight(0xffffff, 1);
      dirLight.position.set(0, 1, 1).normalize();
      scene.add(dirLight);

      // 3) Load models
      const anchor = mindarThree.addAnchor(0);
      const loader = new GLTFLoader();

      // 3a) Center animated model
      const gltfMain = await loader.loadAsync('./assets/model.glb');
      gltfMain.scene.scale.set(0.2, 0.2, 0.2);
      anchor.group.add(gltfMain.scene);

      // 3b) Left-side CV model
      const gltfCV1 = await loader.loadAsync('./assets/cv.glb');
      gltfCV1.scene.scale.set(1, 1, 1);
      gltfCV1.scene.position.set(-1.0, 0, -1.0);
      gltfCV1.scene.userData = { url: 'https://example1.com' };
      anchor.group.add(gltfCV1.scene);

      // 3c) Right-side CV model
      const gltfCV2 = await loader.loadAsync('./assets/cv3.glb');
      gltfCV2.scene.scale.set(1, 1, 1);
      gltfCV2.scene.position.set(1.0, 0, 1.0);
      gltfCV2.scene.userData = { url: 'https://example2.com' };
      anchor.group.add(gltfCV2.scene);

      // 4) Audio element
      const audio = document.querySelector('#marker-sound');

      // 5) Animation setup for center model
      const animationOptions = ['rotate360', 'rotateX', 'rotateY', 'rotateZ', 'pulse'];
      let animationType = 'none';
      let animationInterval = null;
      const chooseRandomAnimation = () => {
        animationType = animationOptions[Math.floor(Math.random() * animationOptions.length)];
      };

      anchor.onTargetFound = () => {
        // play sound only first time
        if (audio && audio.paused) {
          audio.currentTime = 0;
          audio.play();
        }
        chooseRandomAnimation();
        animationInterval = setInterval(chooseRandomAnimation, 2000);
      };
      anchor.onTargetLost = () => {
        animationType = 'none';
        clearInterval(animationInterval);
      };

      // 6) Raycaster for clicks
      const raycaster = new THREE.Raycaster();
      const mouse = new THREE.Vector2();
      window.addEventListener('click', event => {
        mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
        mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
        raycaster.setFromCamera(mouse, camera);
        const hits = raycaster.intersectObjects(anchor.group.children, true);
        if (hits.length > 0) {
          // find parent with URL
          let obj = hits[0].object;
          while (obj && !obj.userData.url) obj = obj.parent;
          if (obj && obj.userData.url) {
            obj.scale.multiplyScalar(1.2);
            setTimeout(() => window.location.href = obj.userData.url, 500);
          }
        }
      });

      // 7) Render loop with animation
      const clock = new THREE.Clock();
      renderer.setAnimationLoop(() => {
        const t = clock.getElapsedTime();

        // reset main model
        gltfMain.scene.rotation.set(0, 0, 0);
        gltfMain.scene.scale.set(0.2, 0.2, 0.2);

        switch (animationType) {
          case 'rotate360':
            gltfMain.scene.rotation.y = t * 4;
            break;
          case 'rotateX':
            gltfMain.scene.rotation.x = t * 2;
            break;
          case 'rotateY':
            gltfMain.scene.rotation.y = t * 2;
            break;
          case 'rotateZ':
            gltfMain.scene.rotation.z = t * 2;
            break;
          case 'pulse':
            const s = 0.1 + Math.sin(t * 5) * 0.05;
            gltfMain.scene.scale.set(s, s, s);
            break;
        }

        renderer.render(scene, camera);
      });

      // 8) Start AR
      await mindarThree.start();
    }

    start();
  </script>
</body>

</html>
