<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>AR Image Tracking</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="style.css" />

  <!-- Import‑map to point bare imports to CDN ESM files -->
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
      "mindar-image-three": "https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-three.prod.js"
    }
  }
  </script>
</head>

<body>
  <div id="ar-container"></div>

  <!-- 🔊 Audio to play when marker is detected -->
  <audio id="marker-sound" src="assets/beep.mp3" preload="auto"></audio>

  <!-- Main script -->
  <script type="module">
    import * as THREE from 'three';
    import { MindARThree } from 'mindar-image-three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

    async function start() {
      const mindarThree = new MindARThree({
        container: document.querySelector('#ar-container'),
        imageTargetSrc: './assets/marker.mind'
      });
      const { renderer, scene, camera } = mindarThree;

      // Lighting
      const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
      const directionalLight = new THREE.DirectionalLight(0xffffff, 1);
      directionalLight.position.set(0, 1, 1).normalize();
      scene.add(ambientLight, directionalLight);

      // Load model
      const anchor = mindarThree.addAnchor(0);
      const loader = new GLTFLoader();
      const gltf = await loader.loadAsync('./assets/model.glb');
      gltf.scene.scale.set(0.2, 0.2, 0.2);
      anchor.group.add(gltf.scene);

      // Play sound when marker is detected
      const audio = document.querySelector('#marker-sound');
      anchor.onTargetFound = () => {
        if (audio) {
          audio.currentTime = 0;
          audio.play();
        }
      };

      // Animation loop
      const clock = new THREE.Clock();
      renderer.setAnimationLoop(() => {
        gltf.scene.rotation.y += clock.getDelta();
        renderer.render(scene, camera);
      });

      await mindarThree.start();
    }

    start();
  </script>
</body>

</html>
