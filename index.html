<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>AR Image Tracking</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="style.css" />

  <!-- Import‑map for modules -->
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
      "mindar-image-three": "https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-three.prod.js"
    }
  }
  </script>
</head>

<body>
  <div id="ar-container"></div>

  <!-- 🔊 Marker Sound -->
  <audio id="marker-sound" src="assets/beep.mp3" preload="auto"></audio>

  <script type="module">
    import * as THREE from 'three';
    import { MindARThree } from 'mindar-image-three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

    async function start() {
      const mindarThree = new MindARThree({
        container: document.querySelector('#ar-container'),
        imageTargetSrc: './assets/marker.mind'
      });
      const { renderer, scene, camera } = mindarThree;

      // Lighting
      scene.add(new THREE.AmbientLight(0xffffff, 0.8));
      const dirLight = new THREE.DirectionalLight(0xffffff, 1);
      dirLight.position.set(0, 1, 1).normalize();
      scene.add(dirLight);

      // Load model
      const anchor = mindarThree.addAnchor(0);
      const loader = new GLTFLoader();
      const gltf = await loader.loadAsync('./assets/model.glb');
      gltf.scene.scale.set(0.15, 0.15, 0.15);
      anchor.group.add(gltf.scene);

      const audio = document.querySelector('#marker-sound');

      // Animation logic
      let animationType = "none";
      let animationInterval = null;

      const animationOptions = ["rotate360", "bobUpDown", "swayLeftRight", "tilt", "pulse"];

      const chooseRandomAnimation = () => {
        animationType = animationOptions[Math.floor(Math.random() * animationOptions.length)];
      };

      anchor.onTargetFound = () => {
        if (audio) {
          audio.currentTime = 0;
          audio.play();
        }
        chooseRandomAnimation();
        animationInterval = setInterval(chooseRandomAnimation, 2000); // every 2 seconds
      };

      anchor.onTargetLost = () => {
        animationType = "none";
        clearInterval(animationInterval);
      };

      // Animate
      const clock = new THREE.Clock();
      renderer.setAnimationLoop(() => {
        const delta = clock.getDelta();
        const time = clock.elapsedTime;

        // Reset
        gltf.scene.rotation.set(0, 0, 0);
        gltf.scene.position.set(0, 0, 0);
        gltf.scene.scale.set(0.2, 0.2, 0.2);

        // Animate based on type (faster)
        switch (animationType) {
          case "rotate360":
            gltf.scene.rotation.y = time * 4;
            break;
          case "bobUpDown":
            gltf.scene.position.y = Math.sin(time * 6) * 0.15;
            break;
          case "swayLeftRight":
            gltf.scene.rotation.z = Math.sin(time * 6) * 0.4;
            break;
          case "tilt":
            gltf.scene.rotation.x = Math.sin(time * 5) * 0.5;
            break;
          case "pulse":
            const scale = 0.2 + Math.sin(time * 5) * 0.05;
            gltf.scene.scale.set(scale, scale, scale);
            break;
        }

        renderer.render(scene, camera);
      });

      await mindarThree.start();
    }

    start();
  </script>
</body>

</html>
